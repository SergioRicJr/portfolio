name: Deploy to Magalu Cloud

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Finish each publication before starting the next one, including manual runs.
concurrency:
  group: magalu-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.ref == 'refs/heads/master' &&
      vars.MGC_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MGC_S3_ENDPOINT: ${{ vars.MGC_S3_ENDPOINT }}
      MGC_REGION: ${{ vars.MGC_REGION }}
      MGC_BUCKET: ${{ vars.MGC_BUCKET }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Magalu configuration
        run: python scripts/deploy-magalu.py --validate

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test deployment
        run: npm run test:deploy

      - name: Build
        run: npm run build

      - name: Publish and verify Magalu objects
        # These are Magalu credentials. The CLI only calls MGC_S3_ENDPOINT.
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MGC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MGC_SECRET_ACCESS_KEY }}
        run: |
          aws --version
          python scripts/deploy-magalu.py

